<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1a1a3a"/>
      <stop offset="100%" stop-color="#080816"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#ffe500"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <!-- estrelas -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="96" cy="110" r="4"/>
    <circle cx="420" cy="96" r="3"/>
    <circle cx="410" cy="300" r="4"/>
    <circle cx="120" cy="330" r="3"/>
    <circle cx="380" cy="420" r="3"/>
  </g>
  <!-- trilha -->
  <path d="M176 440 C176 390, 336 390, 336 340" stroke="url(#trail)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <circle cx="176" cy="440" r="20" fill="#22c55e"/>
  <!-- microfone -->
  <g transform="translate(256 200)">
    <rect x="-56" y="-120" width="112" height="180" rx="56" fill="#ffe500"/>
    <g stroke="#080816" stroke-width="8" stroke-linecap="round" opacity="0.35">
      <line x1="-30" y1="-70" x2="30" y2="-70"/>
      <line x1="-36" y1="-40" x2="36" y2="-40"/>
      <line x1="-36" y1="-10" x2="36" y2="-10"/>
    </g>
    <path d="M-92 10 C-92 90, 92 90, 92 10" stroke="#ffe500" stroke-width="18" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="78" x2="0" y2="126" stroke="#ffe500" stroke-width="18" stroke-linecap="round"/>
  </g>
  <circle cx="336" cy="340" r="22" fill="#080816" stroke="#ffe500" stroke-width="10"/>
</svg>
